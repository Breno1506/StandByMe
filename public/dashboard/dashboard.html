<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StandByMe | Dashboard</title>

    <link rel="stylesheet" href="../css/dashboards.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="buscarAvaliacoes(), buscarFavoritos()">

    <div class="janela">

        <!-- MENU LATERAL -->
        <div class="header-left">
                <h1>StandByMe</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span></h3>
            </div>

            <div class="btn-nav">
                <a href="../homePageLogada.html">
                    <h3>Home</h3>
                </a>
            </div>
            <div class="btn-nav">
                <a href="../dashboard/avalicao.html">
                    <h3>Avaliação</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Logout</h3>
            </div>
        </div>

        <!-- CONTEÚDO DA DASHBOARD -->
        <div class="dash">

            <div class="dash-topo">
                <h2>StandStats</h2>
                <p>Veja os números do StandByMe</p>
            </div>

            <div class="cards-resumo">
                <div class="card-resumo">
                    <h3>Avaliações</h3>
                    <p id="qtdUsuarios">0</p>
                </div>

                <div class="card-resumo">
                    <h3>Personagem mais favoritado</h3>
                    <p id="personagemTop">—</p>
                </div>
            </div>

            <div class="area-graficos">
                <div class="caixa-grafico">
                    <h3>Comparação de avaliações</h3>
                    <div style="position: relative; flex: 1; width: 100%; height: 100%;">
                        <canvas id="graficoUsuarios"></canvas>
                    </div>
                </div>

                <div class="caixa-grafico">
                    <h3>Ranking de personagens favoritos</h3>
                    <div style="position: relative; flex: 1; width: 100%; height: 100%;">
                        <canvas id="graficoFavoritos"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>

<script>
    if (sessionStorage.NOME_USUARIO != undefined) {
        b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
    }

    function limparSessao() {
        sessionStorage.clear();
        window.location.href = "../index.html";
    }

    // Cores bem vibrantes no tema arcade (rosa, branco, amarelo, ciano, roxo, verde)
    var coresPersonagens = {
        "Jonathan Joestar": "#ffffff",
        "Joseph Joestar": "#00ffff",
        "Jotaro Kujo": "#ff2a85",
        "Josuke Higashikata": "#f5c518",
        "Giorno Giovanna": "#bf00ff",
        "Jolyne Cujoh": "#00ff66",
        "Johnny Joestar": "#ff5500",
        "Josuke Higashikata (Parte 8)": "#00bcd4",
        "Jodio Joestar": "#e91e63"
    };

    var coresBarrasArray = ['#ff2a85', '#f5c518', '#00ffff', '#ffffff', '#bf00ff', '#00ff66', '#ff5500'];

    var nomesCurtos = {
        "Josuke Higashikata": "Josuke (Parte 4)",
        "Josuke Higashikata (Parte 8)": "Josuke (Parte 8)"
    };

    function buscarAvaliacoes() {
        fetch("/avaliacoes/listar")
            .then(function (resposta) {
                if (resposta.status == 204) {
                    return [];
                }
                if (!resposta.ok) {
                    throw new Error("Erro ao buscar avaliações: " + resposta.status);
                }
                return resposta.json();
            })
            .then(function (dados) {
                console.log("Avaliações recebidas: ", dados);
                
                qtdUsuarios.innerHTML = dados.length;

                if (dados.length > 0) {
                    plotarGraficoAvaliacoes(dados);
                }
            })
            .catch(function (erro) {
                console.error("Erro nas avaliações: ", erro);
            });
    }

    function plotarGraficoAvaliacoes(dados) {
        var usuarios = [];
        var notas = [];
        var coresDinamicas = [];

        for (var i = 0; i < dados.length; i++) {
            var nomeUser = dados[i].nome || dados[i].nomeUsuario || "Usuário " + (i + 1);
            var notaUser = dados[i].estrelas || dados[i].nota || 0;

            usuarios.push(nomeUser);
            notas.push(notaUser);
            // Pega uma cor diferente para cada barra
            coresDinamicas.push(coresBarrasArray[i % coresBarrasArray.length]);
        }

        var elementoCanvas = document.getElementById('graficoUsuarios');

        new Chart(elementoCanvas, {
            type: 'bar',
            data: {
                labels: usuarios,
                datasets: [{
                    label: 'Estrelas',
                    data: notas,
                    backgroundColor: coresDinamicas,
                    borderColor: '#ffffff',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 5,
                        ticks: {
                            stepSize: 1,
                            color: '#ffffff'
                        },
                        grid: {
                            color: '#262626'
                        }
                    },
                    x: {
                        ticks: {
                            color: '#ffffff'
                        },
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });
    }

    function buscarFavoritos() {
        fetch("/favorito/metricas")
            .then(function (resposta) {
                if (resposta.status == 204) {
                    return [];
                }
                if (!resposta.ok) {
                    throw new Error("Erro na API, status " + resposta.status);
                }
                return resposta.json();
            })
            .then(function (dados) {
                console.log("Dados dos favoritos recebidos: ", dados);
                if (dados.length > 0) {
                    plotarGraficoFavoritos(dados);
                }
            })
            .catch(function (erro) {
                console.error("Erro ao buscar favoritos: ", erro);
            });
    }

    function plotarGraficoFavoritos(dados) {
        var nomes = [];
        var votos = [];
        var cores = [];
        var totalGeral = 0;

        for (var i = 0; i < dados.length; i++) {
            var nomeOriginal = dados[i].nomePersonagem;
            var nomeCurto = nomesCurtos[nomeOriginal] || nomeOriginal;

            nomes.push('#' + dados[i].posicao + ' ' + nomeCurto);
            votos.push(dados[i].totalVotos);
            cores.push(coresPersonagens[nomeOriginal] || '#ff2a85');
            totalGeral += dados[i].totalVotos;
        }

        if (dados.length > 0 && dados[0].totalVotos > 0) {
            personagemTop.innerHTML = nomesCurtos[dados[0].nomePersonagem] || dados[0].nomePersonagem;
        }

        new Chart(graficoFavoritos, {
            type: 'bar',
            data: {
                labels: nomes,
                datasets: [{
                    data: votos,
                    backgroundColor: cores,
                    borderColor: '#ffffff',
                    borderWidth: 2
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: function (contexto) {
                                var votosAtuais = contexto.parsed.x;
                                var percentual = 0;
                                if (totalGeral > 0) {
                                    percentual = Math.round(votosAtuais * 100 / totalGeral);
                                }
                                return votosAtuais + ' favoritos (' + percentual + '%)';
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        ticks: {
                            precision: 0,
                            color: '#ffffff'
                        },
                        grid: {
                            color: '#262626'
                        }
                    },
                    y: {
                        ticks: {
                            color: '#ffffff',
                            font: { size: 10 }
                        },
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });
    }
</script>
